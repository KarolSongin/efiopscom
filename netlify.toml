[build]
command = "npm run build:production"
publish = "dist"
[functions]
directory = "netlify/functions"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[build.environment]
# Public configuration values appear intentionally in code and generated URLs.
# Supabase credentials remain covered by secret scanning.
SECRETS_SCAN_OMIT_KEYS = "ADMIN_MODE,BUILD_MODE,ADMIN_EMAIL,ADMIN_ALLOWED_ORIGIN,CONTACT_ALLOWED_ORIGIN,CONTACT_STORAGE,PUBLIC_GA_MEASUREMENT_ID,PUBLIC_GOOGLE_SITE_VERIFICATION"
